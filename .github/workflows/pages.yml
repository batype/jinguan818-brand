name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify site
        run: node verify.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare static files and sharing URLs
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import os
          import hashlib
          import re
          import shutil
          from pathlib import Path

          target = Path(os.environ['RUNNER_TEMP']) / 'pages-site'
          shutil.copytree('dist', target)
          index = target / 'index.html'
          base_url = os.environ['PAGES_BASE_URL'].rstrip('/')
          html = index.read_text()
          html = html.replace('https://batype.github.io/jinguan818-brand', base_url)
          def version_asset(match):
              filename = match.group('file')
              digest = hashlib.sha256((target / filename).read_bytes()).hexdigest()[:10]
              return f'{match.group("prefix")}{filename}?v={digest}"'
          html = re.sub(
              r'(?P<prefix>(?:src|href)=")(?P<file>assets/[^"?#]+|styles\.css|app\.js|sculpture\.js)"',
              version_asset,
              html,
          )
          index.write_text(html)
          (target / '.nojekyll').touch()
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
